# Central config - toggle blocking channels, feature flags, model, and threshold.
# Referenced by src/business_entity_resolution/inference/predict.py and notebooks.
# Every experiment run should record which config (or which overrides) it used, in
# experiments/experiment_log.csv (see docs/architecture.md §15).

blocking:
  channels:
    exact_name: true
    name_token_overlap: true
    name_char_ngram: true
    address_token_overlap: true
    pin_exact: true
    city_state_cooccurrence: true
    address_char_ngram: true
  char_ngram_size: 4
  candidate_cap_per_s1: 200

features:
  include_cross_field_interactions: true

model:
  type: lightgbm
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    max_depth: 8
    random_state: 42

threshold:
  value: 0.45  # lowered from 0.72 — was causing 43% singletons vs 5.6% true rate
  segmented_by: null

validation:
  n_folds: 5
  val_fraction: 0.2
  group_col: source1_entity_id
  random_state: 42
