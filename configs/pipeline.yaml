# Central config - toggle blocking channels, feature flags, model, and threshold.
# Referenced by src/business_entity_resolution/inference/predict.py and notebooks.
# Every experiment run should record which config (or which overrides) it used, in
# experiments/experiment_log.csv (see docs/architecture.md §15).

blocking:
  channels:
    exact_name: true            # implemented (blocking/block.py channel_a)
    name_token_overlap: false   # TODO - implement then flip to true
    name_char_ngram: false      # TODO
    address_token_overlap: false # TODO
    pin_exact: false            # TODO
    city_state_cooccurrence: false # TODO
    address_char_ngram: false   # TODO
  char_ngram_size: 4
  candidate_cap_per_s1: 200     # safety valve only - document any change (architecture.md §4)

features:
  include_cross_field_interactions: true

model:
  type: baseline    # baseline | lightgbm  (see models/model.py MODEL_REGISTRY)
  params: {}
  # example once moving to lightgbm:
  # type: lightgbm
  # params:
  #   n_estimators: 500
  #   learning_rate: 0.05
  #   num_leaves: 63

threshold:
  value: 0.5        # PLACEHOLDER - must be re-tuned on validation, architecture.md §11
  segmented_by: null  # e.g. "channels" | "country" | null - only adopt with validation evidence

validation:
  n_folds: 5
  val_fraction: 0.2
  group_col: source1_entity_id
  random_state: 42
